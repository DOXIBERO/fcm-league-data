<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Братва — FC Mobile League Notebook</title>
  <meta name="description" content="Official Братва FC Mobile League Notebook">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Patrick+Hand&family=Caveat:wght@400..700&family=Changa:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <div class="content-wrapper">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <!-- Hand-drawn Doodle Crest -->
        <div class="brand-crest" title="Братва Notebook">
          <svg viewBox="0 0 100 100">
            <!-- Sketchy shield -->
            <path d="M 50 5 C 80 15 90 30 80 80 C 65 95 50 95 50 95 C 50 95 35 95 20 80 C 10 30 20 15 50 5 Z" />
            <!-- Inner crown doodle -->
            <path d="M 30 40 L 40 30 L 50 45 L 60 30 L 70 40 L 60 60 L 40 60 Z" />
            <circle cx="45" cy="50" r="3" />
            <circle cx="55" cy="50" r="3" />
          </svg>
        </div>
        <div class="brand-details">
          <div class="brand-text">БРАТВА</div>
          <div class="brand-subtext">LEAGUE NOTES</div>
        </div>
      </div>

      <div class="header-right">
        <!-- Language Dropdown Selector with Tape -->
        <div class="lang-dropdown">
          <button class="lang-btn" id="lang-toggle-btn" aria-label="Select Language">
            <span id="current-lang-code" class="lang-code-text">EN</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="lang-menu" id="lang-menu">
            <button class="lang-opt active" data-lang="en">English</button>
            <button class="lang-opt" data-lang="ar">العربية</button>
            <button class="lang-opt" data-lang="ru">Русский</button>
            <button class="lang-opt" data-lang="es">Español</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Viewport -->
    <main class="main-viewport">

      <!-- TAB: DASHBOARD -->
      <section class="tab-page active" id="tab-dashboard">
        <!-- Hero League Summary Note -->
        <div class="note-card">
          <div class="pin pin-blue"></div>
          <div class="card-title" data-i18n="league_record">
            League Overview
          </div>
          <div style="text-align: right; margin-top: -30px; margin-bottom: 15px;">
            <span id="hero-winrate-badge" class="hand-text" style="font-size: 1.2rem; border-bottom: 2px dashed; padding: 2px;">0.0% WR</span>
          </div>

          <div class="metric-grid">
            <div class="metric-box">
              <div class="metric-val green" id="hero-wins">0</div>
              <div class="metric-lbl hand-text" data-i18n="wins">Wins</div>
            </div>
            <div class="metric-box">
              <div class="metric-val" id="hero-draws">0</div>
              <div class="metric-lbl hand-text" data-i18n="draws">Draws</div>
            </div>
            <div class="metric-box">
              <div class="metric-val red" id="hero-losses">0</div>
              <div class="metric-lbl hand-text" data-i18n="losses">Losses</div>
            </div>
          </div>
        </div>

        <!-- Recent Match Note -->
        <div class="note-card">
          <div class="tape"></div>
          <div class="card-title" data-i18n="recent_tournament">
            Recent Match
          </div>
          <div id="recent-match-container">
            <div style="text-align:center; padding:12px;" class="hand-text" data-i18n="loading">Loading...</div>
          </div>
        </div>

        <!-- Team of the Tournament Spotlight -->
        <div class="note-card polaroid" id="totw-card-box">
          <div class="pin pin-gold" style="top: -5px;"></div>
          <div class="hand-text" style="font-size: 1.2rem; font-weight: bold; margin-bottom: 10px;" data-i18n="totw_spotlight">
            MVPs
          </div>
          <div id="totw-container" style="display: flex; justify-content: space-around;"></div>
        </div>

        <!-- Top Scorer List -->
        <div class="note-card">
          <div class="pin"></div>
          <div class="card-title" data-i18n="top_performers">
            Top Scorers
          </div>
          <table class="sketch-table">
            <thead>
              <tr>
                <th>#</th>
                <th data-i18n="player">Player</th>
                <th data-i18n="goals" style="text-align:right;">G</th>
                <th data-i18n="matches" style="text-align:right;">M</th>
              </tr>
            </thead>
            <tbody id="top-performers-tbody"></tbody>
          </table>
        </div>

        <!-- Flagged List -->
        <div class="note-card" id="flagged-card-box" style="display:none; border: 2px dashed var(--pencil-red); background: #fff0f0;">
          <div class="tape"></div>
          <div class="card-title" style="color: var(--pencil-red);" data-i18n="flagged_players">
            Flagged Review
          </div>
          <div id="flagged-players-list"></div>
        </div>
      </section>

      <!-- TAB: TOURNAMENTS -->
      <section class="tab-page" id="tab-tournaments">
        <div class="note-card">
          <div class="pin"></div>
          <div class="card-title" data-i18n="tournament_history">
            Match History
          </div>
          <div id="tournaments-list-container"></div>
        </div>
      </section>

      <!-- TAB: ROSTER / PLAYERS -->
      <section class="tab-page" id="tab-players">
        <input type="text" id="roster-search-input" class="search-box" placeholder="Search..." data-i18n-ph="search_placeholder">
        <div class="note-card">
          <div class="tape"></div>
          <table class="sketch-table">
            <thead>
              <tr>
                <th data-i18n="player">Player</th>
                <th data-i18n="matches" style="text-align:center;">M</th>
                <th data-i18n="goals" style="text-align:right;">G</th>
              </tr>
            </thead>
            <tbody id="roster-tbody"></tbody>
          </table>
        </div>
      </section>

      <!-- TAB: LEADERBOARD -->
      <section class="tab-page" id="tab-leaderboard">
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
          <button class="doodle-btn active" data-window="all" data-i18n="all_time">All Time</button>
          <button class="doodle-btn" data-window="7" data-i18n="window_7d">7 Days</button>
          <button class="doodle-btn" data-window="30" data-i18n="window_30d">30 Days</button>
        </div>

        <div class="note-card">
          <div class="pin"></div>
          <table class="sketch-table">
            <thead>
              <tr>
                <th>#</th>
                <th data-i18n="player">Player</th>
                <th data-i18n="goals" style="text-align:right;">G</th>
                <th data-i18n="avg_goals" style="text-align:right;">Avg</th>
              </tr>
            </thead>
            <tbody id="leaderboard-tbody"></tbody>
          </table>
        </div>
      </section>

    </main>
  </div> <!-- End content-wrapper -->

  <!-- Modal Overlay (Notebook Page Pop-up) -->
  <div class="modal-overlay" id="player-modal">
    <div class="modal-page" id="modal-page">
      <button class="close-tape" id="modal-close-x">Close X</button>
      <div id="modal-player-content"></div>
    </div>
  </div>

  <!-- Bottom Navigation (Tape Strip) -->
  <nav class="nav-bar">
    <button class="nav-item active" data-tab="dashboard">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span data-i18n="nav_dash">Dash</span>
    </button>
    <button class="nav-item" data-tab="tournaments">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h7"/></svg>
      <span data-i18n="nav_tournaments">Matches</span>
    </button>
    <button class="nav-item" data-tab="players">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      <span data-i18n="nav_roster">Roster</span>
    </button>
    <button class="nav-item" data-tab="leaderboard">
      <svg viewBox="0 0 24 24"><polyline points="18 20 18 10 12 14 6 10 6 20"></polyline></svg>
      <span data-i18n="nav_leaderboard">Stats</span>
    </button>
  </nav>

</div>

<svg style="width:0;height:0;position:absolute;">
  <defs>
    <!-- Filter for sketchy SVG lines -->
    <filter id="displacementFilter">
      <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="2" result="turbulence" />
      <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
</svg>

<script src="app.js"></script>
</body>
</html>
